<!DOCTYPE html>
<html>
<body style="background-color: #27F5E4;">

<h2 style="font-weight:bold; color: blue;">What does a Flip Flop Circuit do?</h2>

<p>here is an example of how a Flip Flop Circuit works.</p>

<img id="myImage" src="aon.png" alt="Zero_Zero Pic" width="300">
</br></br>
<button onclick="zero_zero()" style="padding: 10px;">A on</button>
</br></br>
<button onclick="zero_one()" style="padding: 10px;">A off</button>
</br></br>
<button onclick="one_zero()" style="padding: 10px;">B on</button>
</br></br>
<button onclick="one_one()" style="padding: 10px;">B off</button>

<script>
  function zero_zero() {
    let image = document.getElementById("myImage");
    image.src = "aon.png";
  }
  function zero_one() {
    let image = document.getElementById("myImage");
    image.src = "aoff.png";
  }
  function one_zero() {
    let image = document.getElementById("myImage");
    image.src = "bon.png";
  }
  function one_one() {
    let image = document.getElementById("myImage");
    image.src = "boff.png";
  }
</script>

</body>
</html>
