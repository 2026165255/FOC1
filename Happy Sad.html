<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='happy .PNG'">Make him happy</button>

<img id="myImage" src="sad.PNG" style="width:100px">

<button onclick="document.getElementById('myImage').src='sad.PNG'">make him sad</button>

</body>
</html>
